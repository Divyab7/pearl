; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
	adafruit/Adafruit PWM Servo Driver Library@^3.0.3
	pololu/VL53L0X@^1.3.1
	adafruit/Adafruit MPU6050@^2.2.9
	adafruit/Adafruit NeoPixel@^1.15.5
	bblanchon/ArduinoJson@^7.4.3

[env:serial]

[env:ws]
build_flags = ${env.build_flags} -DLINK_WS=1
lib_deps = 
	${env.lib_deps}
	links2004/WebSockets@^2.7.3

; Device-first (F1–F7): the robot decides with 0G, keeps and locks its own log, signs with its own key and publishes
; to 0G Storage, 0G Chain and Arkiv by itself; the dashboard server reads it at http://<board-ip>:8070.
; Needs an ESP32-S3 with PSRAM (N16R8 / N8R2 / N8R8) and secrets.h (see secrets.example.h).
[env:device]
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags = ${env.build_flags} -DPEARL_DEVICE=1 -DBOARD_HAS_PSRAM -DARDUINOJSON_ENABLE_STD_STRING=1
extra_scripts = pre:gen_assets.py
