<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pearl is a tamper-proof black box for robots: evidence insurers can check, sealed on the robot and recorded on 0G." />
    <meta name="theme-color" content="#f8f5ef" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pearl</title>
    <script>
      // before first paint: the site is light only (owner decision 6 Nov 2026), so drop any theme stored by an older
      // build; on the landing page only, preload its hero image (LCP on #/) so app routes don't pay for it
      try {
        localStorage.removeItem("pearl.theme");
        if (!location.hash || location.hash === "#" || location.hash === "#/") {
          var l = document.createElement("link");
          l.rel = "preload"; l.as = "image"; l.type = "image/webp"; l.href = "/img/factory-1600.webp";
          l.setAttribute("imagesrcset", "/img/factory-640.webp 640w, /img/factory-800.webp 800w, /img/factory-1600.webp 1600w");
          l.setAttribute("imagesizes", "(max-width: 900px) calc(100vw - 32px), 600px");
          l.setAttribute("fetchpriority", "high");
          document.head.appendChild(l);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
