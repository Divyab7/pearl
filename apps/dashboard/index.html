<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pearl: proof of what a robot did, checkable by anyone." />
    <meta name="theme-color" content="#f8f5ef" />
    <title>Pearl</title>
    <script>
      // light by default; dark only when chosen with the toggle (set before paint, so there's no flash)
      try { if (localStorage.getItem("pearl.theme.choice") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
